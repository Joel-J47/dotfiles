# CTRL+1: Anime4K Balanced (Good for your 1080p Monitor)
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/anime4k/Anime4K_Clamp_Highlights.glsl:~~/shaders/anime4k/Anime4K_Restore_CNN_M.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Balanced"

# CTRL+2: ArtCNN + Sharpen (Great for high-quality 1080p movies/non-anime)
# ArtCNN cleans the image, Adaptive Sharpen makes it pop.
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/artcnn/ArtCNN_C4F16.glsl:~~/shaders/utils/adaptive-sharpen.glsl"; show-text "ArtCNN + Adaptive Sharpen"

# CTRL+3: Maximum Sharpness (Anime4K + Adaptive Sharpen)
# Good for your 768p Laptop screen where things might look a bit blurry.
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/anime4k/Anime4K_Restore_CNN_S.glsl:~~/shaders/anime4k/Anime4K_Upscale_CNN_x2_S.glsl:~~/shaders/utils/adaptive-sharpen.glsl"; show-text "Anime4K + Sharpen"

# CTRL+0: Clear all
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Shaders Cleared"

n seek 86
y seek 6